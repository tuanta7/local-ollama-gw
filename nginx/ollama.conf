# Default: /opt/homebrew/etc/nginx/nginx.conf
# Custom: /opt/homebrew/etc/nginx/servers/

upstream ollama {
    server localhost:11434;
}

server {
    listen 8080 default_server;
    server_name _;

    location /hello {
        add_header Content-Type text/plain; 
        return 200 "Hello World\n"; 
    }

    location = /_auth0-userinfo {
        internal;
        proxy_pass https://tuanta7.jp.auth0.com/userinfo;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host tuanta7.jp.auth0.com;
        proxy_ssl_server_name on;
        proxy_ssl_name tuanta7.jp.auth0.com;
    }

    location /o/ {
        auth_request /_auth0-userinfo;

        proxy_pass http://ollama/;
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
    }
}



